
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess My Number</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      .press-start-2p-regular {
  font-family: "Press Start 2P", sans-serif;
  font-weight: 10;
  font-style: normal;
}



        
        body {
            font-family: "Press Start 2P", sans-serif;
            font-size: 10px;
            background-color: rgb(34, 34, 34);
            overflow-x: hidden;
        }

       .modal {
    display: flex;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
} 

.modal-content {
    background-color: rgb(34, 34, 34);
    padding: 20px;
    border-radius: 10px;
    width: 70%;
    text-align: center;
    position: relative;
    line-height: 35px;
} 

.close-modal{
    text-align: end;
    background-color: rgb(34, 34, 34);
    border: none;
}
#closeModal{
  font-family: Arial, Helvetica, sans-serif;
  font-weight: bold;
}
.again-btn{
    display: flex;
    justify-content: flex-start;
    
}

.btw{
    position: relative;
    /*left: 20px; */
    top: -50px;
    font-size: 10px;
    display: flex;
    justify-content: flex-end;
    z-index: 500;
} 

.number-container{
    display: flex;
  justify-content: center; /* Center horizontally */
  align-items: center; /* Center vertically */
    background-color: white;
   width: 90px;
   height: 70px;
   margin: 0 auto;
   margin-top: 40px;
   margin-bottom: 50px;
}
.number{
    z-index: 100;
}

.guess-container{
    display: flex;
    justify-content: center;
   
}
.guess{
    background-color: rgb(34, 34, 34);
  border: 3px solid#F7F7F7;
  width: 100px;
  height: 70px;
  
}

.guess:focus{
  outline: none;
}

.check-container{
display: flex;
justify-content: center;
margin-top: 30px;
margin-bottom: 30px;
}

.line{
    position: relative;
    top: 80px;
    height: 10px;
    background-color: white;
    mix-blend-mode: color-dodge;
}


/* Base CSS styles (your existing styles) remain unchanged */

/* Mobile devices (max-width: 576px) */
@media (max-width: 576px) {
  body {
    font-size: 8px; /* Smaller base font size */
  }
  .again-btn {
    font-size: 0.8rem; /* Adjust button font size */
    margin: 5px;
  }
  .modal-content {
    width: 90%;
    padding: 15px;
  }
  .number-container {
    width: 70px;
    height: 50px;
    margin-top: 20px;
    margin-bottom: 30px;
  }
  .number {
    font-size: 1.5rem; /* Adjust number font size */
  }
  .line{
    top: 75px;
  }
  .guess {
    width: 70px;
    height: 50px;
    font-size: 0.8rem;
  }
  .check {
    font-size: 1rem;
  }
  .message, .score, .highScore {
    font-size: 0.8rem;
  }
}

/* Tablets (max-width: 768px) */
@media (max-width: 768px) {
  body {
    font-size: 9px;
  }
  .modal-content {
    width: 80%;
    padding: 18px;
  }
  .number-container {
    width: 80px;
    height: 70px;
    margin-top: 30px;
    margin-bottom: 40px;
  }
  .number {
    font-size: 1.75rem;
  }
  .guess {
    width: 80px;
    height: 60px;
    font-size: 0.9rem;
  }
  .check {
    font-size: 1.1rem;
  }
  .message, .score, .highScore {
    font-size: 0.9rem;
  }
}

    </style>
</head>

<body class="permanent-marker-regular">
    <header>
        <button class="btn again-btn btn-light m-3">Again!</button>
        <span class="btw text-light">(Between 1 and 20)</span>
        <h1 class="text-light text-center">Guess My Number</h1></h1>
        <p class=" line"></p>
        <div class="number-container">
        <div class="number text-dark fs-1">?</div>
        </div>
    </header>
    <main>
        <section class="top">
            <div class="guess-container">
            <input type="number" class="guess text-light fs-1">
            </div>
            <div class="check-container">
            <button class="btn check btn-light fs-2" id="check">Check!</button>
            </div>
        </section>
        <section class="bottom">
            <p class="message text-light text-center fs-6">Start Guessing....</p>
            <p class="score text-light text-center fs-6" id="guesses-remaining">
                💯 score: 20
                <span class="score text-light "></span>
            </p>
            <p class="highScore text-light text-center fs-6">
                🥇 Highscore: 0
            </p>
        </section>
    </main>
    <div class="modal" id="modal">
        <div class="modal-content">
        <button class="closeModal btn btn-sm  border-dark text-light close-modal fs-4" id="closeModal">X</button>
        <h2 class="text-light fs-4">Choose difficulty level</h2>
        <div class="options">
            <div id=""difficulty-level>
                <input type="radio" name="difficulty" id="easy" value="easy" class="difficulty" checked>
                <label class="text-light" for="easy" data-default="true" checked>easy (20 guesses)</label>
            </div>
            <div>
                <input type="radio" name="difficulty" id="medium" value="medium" class="difficulty">
                <label class="text-light" for="medium">medium (10 guesses)</label>
            </div>
            <div>
                <input type="radio" name="difficulty" id="hard" value="hard" class="difficulty">
                <label class="text-light" for="hard">hard (5 guesses)</label>
            </div>
        </div>
        <div>
            <button class="btn btn-light btn-start closeModal" id="start">Start!</button>
        </div>
        </div>
    </div>
    <div class="overlay-hidden">

    </div>
    <script src="script.js"></script>
</body>

</html>
